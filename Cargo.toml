[package]
name = "corvix"
version = "0.3.0"
edition = "2024"
authors = ["Jonas Everaert"]
description = "A task scheduler with dependency and priorities support"
repository = "https://github.com/jomy10/batcher"
license = "MIT"
keywords = ["scheduler", "framework", "priority", "queue", "task"]
categories = ["concurrency"]

[dependencies]
itertools = "0.15.0"
log = "0.4.33"
petgraph = "0.8.3"
uuid = { version = "1.24.0", features = ["v4"] }

rayon = { version = "1.12.0", optional = true }

[features]
# Adds parallelization for computing `graph_with_names`
rayon = ["petgraph/rayon", "dep:rayon"]

# [dev-dependencies]
# colog = "1.4"
